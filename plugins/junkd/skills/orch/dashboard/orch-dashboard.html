<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch dashboard</title>
<style>
:root{
  --bg:#0f0f10; --panel:#17171a; --panel2:#1d1d21; --line:#2a2a30; --text:#e7e7ea; --dim:#9a9aa5; --faint:#6b6b76;
  --accent:#e8711a; --green:#3fb96b; --yellow:#e0b030; --red:#ef5350; --grey:#7a7a85; --blue:#4c8dff; --ink:#0f0f10;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --lw:220px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --panel2:#f0eeea; --line:#ddd9d2; --text:#1d1d20; --dim:#5d5d68; --faint:#8a8a94;
    --accent:#c85a0a; --green:#1f8a4c; --yellow:#a87a00; --red:#d23a37; --grey:#8a8a94; --blue:#2f6fe0; --ink:#ffffff;
  }
}
*{box-sizing:border-box}
body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{max-width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:15px;white-space:nowrap}
.meta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.meta .branch{color:var(--text)}
.spacer{flex:1}
.pill{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;background:var(--panel2)}
.pill.u{color:var(--c);border-color:var(--c)}
.pill.u::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}
.pill.wd{font-size:11px}
.abtn{cursor:pointer;font-family:var(--mono);font-size:12px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);white-space:nowrap}
.abtn:hover{border-color:var(--accent)}
.abtn .red{color:var(--red);font-weight:600}
main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;width:100%;max-width:min(1500px,100%);min-width:0;margin:0 auto}
main>*,.bottom>*{min-width:0;max-width:100%}
h2{margin:0 0 8px;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
h2 small{font:inherit;letter-spacing:0;text-transform:none;color:var(--faint);margin-left:6px}
/* gantt */
.gwrap{width:100%;max-width:100%;min-width:0;overflow:auto;max-height:60vh;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.gantt{position:relative}
.g-row{display:grid;grid-template-columns:var(--lw) 1fr;border-top:1px solid var(--line);position:relative}
.g-row.g-axis{border-top:0;height:40px;position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.g-l{position:sticky;left:0;z-index:4;background:var(--panel);padding:6px 12px;display:grid;gap:1px;align-content:center;min-width:0;border-right:1px solid var(--line)}
.g-l .t1{display:flex;gap:7px;align-items:baseline;min-width:0}
.g-l .id{font-family:var(--mono);font-weight:600;color:var(--accent)}
.g-l .title{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.g-l .cnt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.cnt .ok{color:var(--green)} .cnt .pm{color:var(--yellow)}
.g-t{position:relative}
.g-row.q .g-l{opacity:.7}
.g-row.q .g-t span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;font-style:italic;color:var(--faint)}
.tick{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.nowtag{position:absolute;transform:translateX(-100%);padding-right:5px;top:21px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.g-grid,.g-now{position:absolute;top:0;bottom:0;left:var(--lw);right:0;pointer-events:none}
.g-grid{z-index:0}
.g-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
.g-now{z-index:3}
.g-now i{position:absolute;top:0;bottom:0;margin-left:-1px;width:2px;background:var(--accent)}
.bar{position:absolute;height:24px;min-width:4px;border-radius:4px;background:var(--k);color:var(--ink);display:flex;align-items:center;gap:4px;padding:0 6px;font-family:var(--mono);font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;cursor:default}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;position:relative}
.bar.implement{--k:var(--accent)} .bar.verify{--k:var(--blue)} .bar.fix{--k:var(--yellow)} .bar.done{--k:var(--green);min-width:86px}
.bar.dead{--k:var(--red);background:repeating-linear-gradient(135deg,var(--red) 0 5px,rgba(0,0,0,.3) 5px 10px);color:#fff}
.bar .x{flex:none;position:relative;color:#fff;font-size:12px;text-shadow:0 0 3px rgba(0,0,0,.7)}
.bar .hatch{position:absolute;right:0;top:0;bottom:0;width:38px;background:repeating-linear-gradient(135deg,var(--red) 0 5px,rgba(0,0,0,.4) 5px 10px)}
.bar.live::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:#fff;opacity:.85}
@media (prefers-reduced-motion:no-preference){.bar.live::after{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;background:var(--k)}
.legend i.h{background:repeating-linear-gradient(135deg,var(--red) 0 3px,rgba(0,0,0,.3) 3px 6px)}
.legend i.p{background:none;border:1.5px dashed var(--dim)}
.legend i.n{width:2px;height:12px;border-radius:0;background:var(--accent)}
/* agents overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.ov.open{opacity:1;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.dh h2{margin:0}
.dx{cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;font-size:15px;color:var(--dim);flex:none}
.dx:hover{border-color:var(--accent);color:var(--text)}
.abrd{flex:1;min-height:0;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;align-content:start;width:100%;max-width:1500px;margin:0 auto}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:3px;cursor:pointer}
.agent:hover{border-color:var(--accent)}
.agent.dead{border-left:3px solid var(--red)}
.agent.queued{border-style:dashed;opacity:.8}
.agent .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.agent .name{font-family:var(--mono);font-weight:600}
.st{font-size:12px;font-weight:500;white-space:nowrap}
.st.running{color:var(--green)} .st.waiting{color:var(--yellow)} .st.done{color:var(--grey)} .st.dead{color:var(--red)} .st.queued{color:var(--faint)}
.sub{color:var(--dim);font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--dim)}
.row span:last-child{color:var(--text);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wt{font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.deadnote{color:var(--red);font-size:12px;font-family:var(--mono);margin-top:2px}
.lnk{cursor:pointer;background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline dotted}
.lnk:hover{text-decoration:underline}
.bar{cursor:pointer}
.bar.plan{background:transparent;border:1.5px dashed var(--k);color:var(--dim);font-weight:500;cursor:default}
.g-grid i.day{background:var(--faint);opacity:1;width:2px}
.tick.h{font-weight:600;color:var(--text)}
/* overview */
.mmrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px;max-width:100%;min-width:0}
.mm{position:relative;flex:1 1 320px;min-width:0;height:56px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.mm>*{pointer-events:none}
.mmd{position:absolute;top:0;bottom:0;width:1px;background:var(--faint);opacity:.8}
.mmdl{position:absolute;top:1px;font:10px/12px var(--mono);color:var(--dim);white-space:nowrap}
.mmb{position:absolute;height:2px;min-width:3px;background:var(--k)}
.mmb.implement{--k:var(--accent)} .mmb.verify{--k:var(--blue)} .mmb.fix{--k:var(--yellow)} .mmb.done{--k:var(--green)} .mmb.dead{--k:var(--red)}
.mmb.plan{background:repeating-linear-gradient(90deg,var(--k) 0 3px,transparent 3px 5px)}
.mmn{position:absolute;top:0;bottom:0;margin-left:-1px;width:2px;background:var(--accent)}
.mmv{position:absolute;top:0;bottom:0;min-width:8px;border:1px solid var(--accent);border-radius:3px;cursor:grab}
.mmv::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:.2}
.g-grid i.gapcol{width:28px;opacity:.55;background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 7px);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.gapmk{position:absolute;top:0;bottom:0;z-index:2;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.gaplbl{position:absolute;left:50%;top:4px;transform:translateX(-50%);padding:0 4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font:600 10px/15px var(--mono);color:var(--dim);white-space:nowrap}
.g-row.hl{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.g-row.hl .g-l{background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.mmb{opacity:.6}
.mmb.act{height:3px;opacity:1}
.mmg{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 5px);opacity:.45}
.mmh{position:absolute;left:0;right:0;display:none;background:var(--accent);opacity:.18}
.daylbl{position:absolute;top:21px;margin-left:4px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text);white-space:nowrap}
.ctl{display:flex;gap:6px;align-items:center;flex:none;max-width:100%;flex-wrap:wrap}
.ctl button{cursor:pointer;font:12px var(--mono);padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.ctl button:hover{border-color:var(--accent);color:var(--text)}
.ctl button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
/* agent detail */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.detail{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);visibility:hidden;transition:transform .22s,visibility .22s;display:flex;flex-direction:column;overflow:hidden}
.dt.open .backdrop{opacity:1;visibility:visible}
.dt.open .detail{transform:none;visibility:visible}
#dname{font:600 15px var(--mono);letter-spacing:0;text-transform:none;color:var(--text)}
.dinfo{flex:none;max-height:55%;overflow-y:auto;padding:12px 16px;display:grid;gap:5px}
.evh{margin:0;padding:10px 16px 6px;border-top:1px solid var(--line);flex:none}
.evwrap{flex:1;min-height:100px;overflow-y:auto;padding:4px 16px 16px 30px}
.evwrap .tl{padding-left:0}
.evwrap .tl li::before{left:-4px}
.evwrap .tl li{padding-left:14px}
.evwrap .tl .none{color:var(--faint);font-style:italic}
/* board */
.tg{margin:0 0 8px}
.tg button{cursor:pointer;background:none;border:0;padding:2px 0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;align-items:center;gap:6px}
.tg button:hover{color:var(--text)}
.chev{display:inline-block;transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(90deg)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.board[hidden]{display:none}
.col,.card{min-width:0}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:120px;display:grid;gap:8px;align-content:start}
.col h3{margin:0;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);display:flex;justify-content:space-between}
.col h3 em{font-style:normal;color:var(--accent)}
.empty{color:var(--faint);font-size:12.5px;font-style:italic;padding:6px 2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px;display:grid;gap:5px}
.card .t{display:flex;gap:8px;align-items:baseline}
.card .id{font-family:var(--mono);font-weight:600;color:var(--accent)}
.card .title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.chip{font-family:var(--mono);font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--dim);margin-left:auto;white-space:nowrap}
.who{font-family:var(--mono);font-size:12px;color:var(--dim)}
.counts{font-family:var(--mono);font-size:12px}
.counts .ok{color:var(--green)} .counts .pm{color:var(--yellow)}
.note{font-size:12.5px;color:var(--dim);border-top:1px dashed var(--line);padding-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.barlbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.bottom{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.panel{min-width:0;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line);display:grid;gap:9px}
.tl li{position:relative;display:flex;gap:12px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-18px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--grey)}
.tl li.fail::before{background:var(--red)} .tl li.pass::before{background:var(--green)}
.tl time{font-family:var(--mono);color:var(--faint);font-size:12.5px;flex:0 0 42px}
.tl li.fail span{color:var(--red)} .tl li.pass span{color:var(--green)}
.ls{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ls li{display:flex;gap:10px;font-size:13.5px}
.ls b{font-family:var(--mono);color:var(--accent);font-weight:600;flex:0 0 36px}
@media (max-width:1000px){.board,.abrd{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.abrd{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.detail{border-left:0}}
@media (max-width:560px){:root{--lw:150px}.board{grid-template-columns:minmax(0,1fr)}.spacer{display:none}main{padding:12px}header{padding:10px 12px}}
</style>
</head>
<body>
<header id="hdr"></header>
<main>
  <section><h2>Timeline <small id="wlbl"></small></h2>
    <div class="mmrow">
      <div class="mm" id="mm" tabindex="0" role="slider" aria-label="Timeline overview, drag the highlighted span to pan the chart" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <div class="ctl" id="ctl" role="group" aria-label="Timeline zoom">
        <button type="button" data-z="60" aria-pressed="false">1h</button><button type="button" data-z="180" aria-pressed="true">3h</button><button type="button" data-z="720" aria-pressed="false">12h</button><button type="button" data-z="0" aria-pressed="false">all</button><button type="button" id="bnow">now</button>
      </div>
    </div>
    <div class="gwrap" id="gw"><div class="gantt" id="gantt"></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <section>
    <h2 class="tg"><button type="button" id="btog" aria-expanded="false" aria-controls="board"><span class="chev" aria-hidden="true">▸</span>Board <small id="bcnt"></small></button></h2>
    <div class="board" id="board" hidden></div>
  </section>
  <div class="bottom">
    <section class="panel"><h2>Recent events</h2><ul class="tl" id="events"></ul></section>
    <section class="panel"><h2>Lessons</h2><ul class="ls" id="lessons"></ul></section>
  </div>
</main>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="otitle">
  <div class="dh"><h2 id="otitle">Agents</h2><button type="button" class="dx" id="oclose" aria-label="Close agents">✕</button></div>
  <div class="abrd" id="agents"></div>
</div>
<div class="dt" id="dt">
  <div class="backdrop" id="dbd"></div>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dname">
    <div class="dh"><h2 id="dname"></h2><button type="button" class="dx" id="dtclose" aria-label="Close agent detail">✕</button></div>
    <div class="dinfo" id="dinfo"></div>
    <h2 class="evh">Events <small id="evn"></small></h2>
    <div class="evwrap" id="evwrap" tabindex="0"><ul class="tl" id="aev"></ul></div>
  </aside>
</div>
<script src="status.js"></script>
<script src="scale.js"></script>
<script>
/* No status.js beside the page (or one that did not run): an empty page and the "status.js unreachable" note.
   The demo data is status.sample.js, the data contract at its top. */
var ORCH_UNREACHABLE=!window.ORCH;
if(!window.ORCH){window.ORCH={mock:true,generatedAt:Date.now(),tasks:[],agents:[],events:[],lessons:[],usage:{},watchdog:{}};}
(function(){
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function ago(s){s=Math.round(s);if(s<60)return s+" s";var m=Math.round(s/60);return m<60?m+" m":Math.floor(m/60)+" h "+(m%60)+" m"}
function ucol(p){return p<=50?"var(--green)":p<=80?"var(--accent)":"var(--red)"}
function hm(s){var a=s.split(":");return (+a[0])*60+(+a[1])}
function pad(n){return (n<10?"0":"")+n}
function mid(a){var d=new Date(a*60000);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/60000}
function nextMid(a){var d=new Date(a*60000);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()/60000}
function tm(s){
  if(typeof s==="number")return s/60000;
  var m=String(s).match(/^(\d+)-(\d+)-(\d+) (\d+):(\d+)$/);
  if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime()/60000;
  if(/^\d{4}-\d\d-\d\dT/.test(s))return Date.parse(s)/60000;
  var d=mid(NOW)+hm(s);return d>NOW?d-1440:d}
function fmtT(a){var d=new Date(a*60000);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dayStr(a){var d=new Date(a*60000);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtDM(a){var d=new Date(a*60000);return pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+fmtT(a)}
function fmtTD(a){return dayStr(a)!==dayStr(NOW)?dayStr(a).slice(5)+" "+fmtT(a):fmtT(a)}
function median(a){a=a.slice().sort(function(x,y){return x-y});var n=a.length;return !n?0:n%2?a[(n-1)/2]:Math.round((a[n/2-1]+a[n/2])/2)}
var GAPW=28,GAPMIN=45;
var NOW=0,zoomMin=180,geom={LW:220,plotW:0,now:0,order:[],pitch:2,xOf:function(){return 0},tOf:function(){return 0}},mmv=null,mmh=null;
var hlId=null,kbId=null,rowById={},lastH=0,lastV=0,progLeft=0,progTop=0;
function fmt(n){return ("0"+Math.floor(n/60)).slice(-2)+":"+("0"+n%60).slice(-2)}

    var tr=el("div","g-t");
    var off=(rowH-(lay.n*28-4))/2;
    lay.items.forEach(function(o){
      var it=o.it,kind=it.kind,left=xOf(it.start),w=Math.max(0,xOf(it.end)-left);
      var bar=el("div","bar "+kind+(it.q?" plan":""));bar.tabIndex=0;
      bar.style.left=left+"px";bar.style.width=w+"px";bar.style.top=(off+o.l*28)+"px";
      var tip;
      if(it.q){
        bar.appendChild(el("span",null,kind));
        tip="planned · after "+((t.deps&&t.deps.length)?t.deps.join(", "):"now")+" · est "+fmtTD(it.start)+"–"+fmtTD(it.end)+"\nest. "+kind+" "+it.q.m+" min = median of "+it.q.n+" past"}
      else{
        var p=it.p;
        bar.setAttribute("role","button");bar.dataset.ak="bar:"+t.id+":"+p.agent+"@"+p.start;
        (function(bb,nm){activator(bb,function(){openAgent(nm,bb)})})(bar,p.agent);
        if(it.end>=NOW&&kind!=="done")bar.classList.add("live");
        if(p.killed)bar.appendChild(el("i","hatch"));
        bar.appendChild(el("span",null,kind==="done"?(p.note||"done"):p.agent+(kind==="fix"?" · fix":"")));
        if(p.killed||kind==="dead")bar.appendChild(el("span","x","✖"));
        tip=p.agent+" · "+p.model+" · "+fmtTD(it.start)+"–"+(it.end>=NOW?"now":fmtTD(it.end))+" · ctx "+p.ctx+(p.note?" · "+p.note:"")}
      bar.title=tip;bar.setAttribute("aria-label",tip.replace("\n"," · "));
      tr.appendChild(bar)});
    row.appendChild(tr);g.appendChild(row)});
  var now=el("div","g-now"),ni=document.createElement("i");ni.style.left=xOf(NOW)+"px";now.appendChild(ni);g.appendChild(now);

  /* scroll: follow now / active rows unless the user scrolled in the last 20 s */
  var tn=Date.now(),autoH=tn-lastH>20000,autoV=tn-lastV>20000;
  var newLeft=autoH?xOf(NOW)-vis+28:xOf(anchorT),newTop=stp;
  if(autoV){
    var fr=null;
    order.some(function(o){if(o.g===0){fr=rowById[o.t.id];return true}return false});
    newTop=fr?fr.offsetTop-40:0}
  setScroll(newLeft,newTop);
  if(hlId&&!rowById[hlId])hlId=null;

  /* overview */
  clear(mm);
  mmh=el("div","mmh");mm.appendChild(mmh);
  var mmW=mm.clientWidth||600,pitch=geom.pitch;
  function P(t){return (xOf(t)/plotW*100)+"%"}
  gaps.forEach(function(gp){
    var gx=el("div","mmg");gx.style.left=P(gp.s);gx.style.width="max(3px,"+(GAPW/plotW*100)+"%)";mm.appendChild(gx)});
  if(START!==mid(START)&&xOf(nextMid(START))/plotW*mmW>=48){var l0=el("span","mmdl",dayStr(START).slice(5));l0.style.left="3px";mm.appendChild(l0)}
  mids.forEach(function(m0){
    if(gapAt(m0))return;
    var ml=el("div","mmd");ml.style.left=P(m0);mm.appendChild(ml);
    var mt=el("span","mmdl",dayStr(m0).slice(5));mt.style.left="calc("+P(m0)+" + 3px)";mm.appendChild(mt)});
  order.forEach(function(od,i){
    var t=od.t,top=(16+i*pitch)+"px",cls=od.g===0?" act":"";
    function mb(kind,s0,e0,pl){
      var x=el("div","mmb "+kind+(pl?" plan":"")+cls);x.style.left=P(s0);x.style.width=Math.max(0,(xOf(e0)-xOf(s0))/plotW*100)+"%";x.style.top=top;mm.appendChild(x)}
    (t.phases||[]).forEach(function(p){mb(p.killed?"dead":p.kind,tm(p.start),tm(p.end),false)});
    (plans[t.id]||[]).forEach(function(q){mb(q.kind,q.start,q.end,true)})});
  var mn=el("div","mmn");mn.style.left=P(NOW);mm.appendChild(mn);
  mmv=el("div","mmv");mm.appendChild(mmv);
  setHl(hlId);
  updateVp();

  /* agents overlay */
  document.getElementById("otitle").textContent="Agents · "+nRun+" running · "+nDead+" dead";
  clear(ag);
  [["running",["running","waiting"]],["dead",["dead"]],["done",["done"]],["idle / queued",["queued"]]].forEach(function(cd){
    var as=O.agents.filter(function(a){return cd[1].indexOf(a.status)>=0});
    var col=el("div","col");
    var hh=el("h3");hh.appendChild(el("span",null,cd[0]));hh.appendChild(el("em",null,String(as.length)));col.appendChild(hh);
    if(!as.length)col.appendChild(el("div","empty","none"));
    as.forEach(function(a){col.appendChild(agentCard(a))});
    ag.appendChild(col)});

  /* board (collapsed state lives on #board.hidden, untouched here) */
  clear(b);
  [["todo","todo"],["in progress","progress"],["verify","verify"],["done","done"]].forEach(function(cd){
    var ts=O.tasks.filter(function(t){return t.column===cd[1]});
    var col=el("div","col");
    var hh=el("h3");hh.appendChild(el("span",null,cd[0]));hh.appendChild(el("em",null,String(ts.length)));col.appendChild(hh);
    if(!ts.length)col.appendChild(el("div","empty","nothing here"));
    ts.forEach(function(t){
      var c=el("div","card");
      var tt=el("div","t");tt.appendChild(el("span","id",t.id));tt.appendChild(el("span","title",t.title));
      if(t.round)tt.appendChild(el("span","chip","r"+t.round));
      if(t.blocked)tt.appendChild(el("span","chip","blocked"));c.appendChild(tt);
      if(t.implementer){var wh=el("div","who");wh.appendChild(nameLink(t.implementer,"lnk:"+t.id+":i"));wh.appendChild(document.createTextNode(" / "));wh.appendChild(nameLink(t.verifier,"lnk:"+t.id+":v"));c.appendChild(wh)}
      if(t.worktree){var w=el("div","wt",t.worktree);w.title=t.worktree;c.appendChild(w)}
      if(t.lastActivity)c.appendChild(el("div","sub","last activity "+hmT(t.lastActivity)));
      if(t.ac){
        var k=el("div","counts");
        k.appendChild(el("span",t.ac[0]===t.ac[1]?"ok":null,"AC "+t.ac[0]+"/"+t.ac[1]));
        if(t.acx){k.appendChild(document.createTextNode(" · "));k.appendChild(el("span",t.acx[0]===t.acx[1]?"ok":"pm","ACX "+t.acx[0]+"/"+t.acx[1]))}
        c.appendChild(k)}
      if((t.column==="progress"||t.column==="verify")&&t.ac){
        var bar=el("div","pbar"),i=el("i");i.style.width=Math.round(t.ac[0]/t.ac[1]*100)+"%";bar.appendChild(i);c.appendChild(bar);
        var l=el("div","barlbl");l.appendChild(el("span",null,t.commits!=null?t.commits+" commits":""));l.appendChild(el("span",null,t.ac[0]+"/"+t.ac[1]+" gates"));c.appendChild(l)}
      if(t.note){var n=el("div","note",t.note);n.title=t.note;c.appendChild(n)}
      col.appendChild(c)});
    b.appendChild(col)});
  document.getElementById("bcnt").textContent=O.tasks.length+" tasks";

  clear(ev);
  if(!O.events.length)ev.appendChild(el("li","none","no events yet"));
  O.events.forEach(function(e){var li=el("li",e.kind);li.appendChild(el("time",null,hmT(e.t)));li.appendChild(el("span",null,e.text));ev.appendChild(li)});
  clear(lsn);
  if(!O.lessons.length)lsn.appendChild(el("li","none","no lessons yet"));
  O.lessons.forEach(function(l){var li=el("li");li.appendChild(el("b",null,l.task));li.appendChild(el("span",null,l.text));lsn.appendChild(li)});
  renderDetail();
}

render();

/* poll: reload status.js every 5 s (file:// safe), re-render in place */
var busy=false;
function poll(){
  if(busy)return;busy=true;
  var s=document.createElement("script");
  s.src="status.js?t="+Date.now();
  s.onload=function(){s.remove();busy=false;mUn.hidden=true;if(window.ORCH){var fa=document.activeElement,ak=fa&&fa.dataset?fa.dataset.ak:null;render();if(ak){var nn=document.querySelector('[data-ak="'+ak+'"]');if(nn&&nn!==document.activeElement)nn.focus()}}};
  s.onerror=function(){s.remove();busy=false;mUn.hidden=false};
  document.head.appendChild(s)}
setInterval(poll,5000);
})();
</script>
</body>
</html>
